name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Only one deploy at a time; cancel superseded runs.
concurrency:
  group: deploy-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Use pnpm instead of npm: Node 22's npm deadlocks on this runner
      # ("Exit handler never called!"), regardless of npm version. pnpm is
      # installed standalone and installs reliably.
      - uses: pnpm/action-setup@v4
        with:
          version: 9

      # Astro 7 requires Node >=22.12.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - run: pnpm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Creates the Pages project named "site" on first run if it
          # doesn't already exist.
          command: pages deploy dist --project-name=site --branch=main
