<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" width="680" height="360" role="img" aria-labelledby="t d">
  <title id="t">How santa gets from a roster to sent emails</title>
  <desc id="d">Six stages: roster.csv, check, pair, seal, verify, send. Pairing tries rejection sampling, then backtracking search, then the smallest accommodation. Sending climbs four rungs: dry run, Mailpit rehearsal, one real test email, then typing send N.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#a89984"/>
    </marker>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .sans { font-family: system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
      .stage { fill: #32302f; stroke: #665c54; stroke-width: 1.5; }
      .stage-text { fill: #ebdbb2; font-size: 14px; }
      .panel { fill: none; stroke: #504945; stroke-width: 1.5; stroke-dasharray: 5 4; }
      .head { fill: #a89984; font-size: 12.5px; }
      .step { fill: #282828; stroke: #504945; stroke-width: 1; }
      .label { font-size: 13.5px; font-weight: 600; }
      .desc { fill: #d5c4a1; font-size: 12.5px; }
      .note { fill: #a89984; font-size: 12px; }
      .line { stroke: #a89984; stroke-width: 1.5; fill: none; }
    </style>
  </defs>

  <rect width="680" height="360" rx="10" fill="#1d2021"/>

  <!-- main stages -->
  <g class="mono">
    <rect class="stage" x="19"  y="30" width="92" height="44" rx="7"/>
    <text class="stage-text" x="65"  y="57" text-anchor="middle">roster</text>
    <rect class="stage" x="129" y="30" width="92" height="44" rx="7" style="stroke:#fabd2f"/>
    <text class="stage-text" x="175" y="57" text-anchor="middle">check</text>
    <rect class="stage" x="239" y="30" width="92" height="44" rx="7" style="stroke:#fabd2f"/>
    <text class="stage-text" x="285" y="57" text-anchor="middle">pair</text>
    <rect class="stage" x="349" y="30" width="92" height="44" rx="7" style="stroke:#8ec07c"/>
    <text class="stage-text" x="395" y="57" text-anchor="middle">seal</text>
    <rect class="stage" x="459" y="30" width="92" height="44" rx="7" style="stroke:#8ec07c"/>
    <text class="stage-text" x="505" y="57" text-anchor="middle">verify</text>
    <rect class="stage" x="569" y="30" width="92" height="44" rx="7" style="stroke:#fe8019"/>
    <text class="stage-text" x="615" y="57" text-anchor="middle">send</text>
  </g>
  <g>
    <line class="line" x1="111" y1="52" x2="127" y2="52" marker-end="url(#a)"/>
    <line class="line" x1="221" y1="52" x2="237" y2="52" marker-end="url(#a)"/>
    <line class="line" x1="331" y1="52" x2="347" y2="52" marker-end="url(#a)"/>
    <line class="line" x1="441" y1="52" x2="457" y2="52" marker-end="url(#a)"/>
    <line class="line" x1="551" y1="52" x2="567" y2="52" marker-end="url(#a)"/>
  </g>
  <text class="sans note" x="450" y="96" text-anchor="middle">seal: indices + roster hash, never names</text>

  <!-- pair detail -->
  <line class="line" x1="285" y1="74" x2="285" y2="110"/>
  <rect class="panel" x="19" y="110" width="400" height="232" rx="8"/>
  <text class="sans head" x="35" y="132">pair: cheapest method first</text>

  <rect class="step" x="35" y="144" width="368" height="50" rx="6"/>
  <text class="mono label" x="49" y="165" fill="#fabd2f">1  sample</text>
  <text class="sans desc" x="49" y="184">shuffle until a draw passes every rule (uniform)</text>
  <line class="line" x1="219" y1="194" x2="219" y2="206" marker-end="url(#a)"/>
  <text class="sans note" x="229" y="204">no luck in 200,000 tries</text>

  <rect class="step" x="35" y="208" width="368" height="50" rx="6"/>
  <text class="mono label" x="49" y="229" fill="#83a598">2  search</text>
  <text class="sans desc" x="49" y="248">backtrack: find a pairing or prove there is none</text>
  <line class="line" x1="219" y1="258" x2="219" y2="270" marker-end="url(#a)"/>
  <text class="sans note" x="229" y="268">none exists</text>

  <rect class="step" x="35" y="272" width="368" height="50" rx="6"/>
  <text class="mono label" x="49" y="293" fill="#d3869b">3  accommodate</text>
  <text class="sans desc" x="49" y="312">bend the fewest rules, in a fixed order; NoSelf never</text>

  <!-- send detail -->
  <line class="line" x1="615" y1="74" x2="615" y2="110"/>
  <rect class="panel" x="437" y="110" width="224" height="232" rx="8"/>
  <text class="sans head" x="453" y="132">send: four rungs of nerve</text>

  <rect class="step" x="453" y="144" width="192" height="42" rx="6"/>
  <text class="mono label" x="465" y="162" fill="#ebdbb2">--dry-run</text>
  <text class="sans desc" x="465" y="179">receivers redacted</text>

  <rect class="step" x="453" y="193" width="192" height="42" rx="6"/>
  <text class="mono label" x="465" y="211" fill="#ebdbb2">Mailpit</text>
  <text class="sans desc" x="465" y="228">full rehearsal, local inbox</text>

  <rect class="step" x="453" y="242" width="192" height="42" rx="6"/>
  <text class="mono label" x="465" y="260" fill="#ebdbb2">smoke-gmail</text>
  <text class="sans desc" x="465" y="277">one [TEST] email, to me</text>

  <rect class="step" x="453" y="291" width="192" height="42" rx="6" style="stroke:#fe8019"/>
  <text class="mono label" x="465" y="309" fill="#fe8019">send N</text>
  <text class="sans desc" x="465" y="326">type the count, or abort</text>
</svg>
