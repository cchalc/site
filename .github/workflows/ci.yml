name: CI

# Build check for pull requests. Deploys happen only from deploy.yml on main.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Same toolchain as deploy.yml: pnpm 9 (Node 22 npm deadlocks), Node 22.
      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      # The site's only gate: validates frontmatter, renders every route, and
      # fails if src/blyg/ledger.json is out of date.
      - name: Build
        run: pnpm run build
