name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Only one deploy at a time; cancel superseded runs.
concurrency:
  group: deploy-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Astro 7 requires Node >=22.12.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Node 22 bundles npm 10.9.x, which deadlocks on this runner
      # ("Exit handler never called!"). Pin a known-good npm via corepack.
      - name: Pin npm 10.8.2
        run: |
          corepack enable
          corepack prepare npm@10.8.2 --activate
          npm --version

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Creates the Pages project named "site" on first run if it
          # doesn't already exist.
          command: pages deploy dist --project-name=site --branch=main
