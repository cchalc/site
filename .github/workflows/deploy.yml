name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Only one deploy at a time; cancel superseded runs.
concurrency:
  group: deploy-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Use pnpm instead of npm: Node 22's npm deadlocks on this runner
      # ("Exit handler never called!"), regardless of npm version. pnpm 9 is
      # installed standalone and runs dependency build scripts automatically
      # (pnpm 10+ blocks them, which breaks esbuild/Astro).
      - uses: pnpm/action-setup@v4
        with:
          version: 9

      # Astro 7 requires Node >=22.12.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - run: pnpm run build

      # Run wrangler via pnpm (not cloudflare/wrangler-action, which installs
      # wrangler with npm and hits the Node 22 npm deadlock on this runner).
      - name: Deploy to Cloudflare Pages
        run: pnpm dlx wrangler@4 pages deploy dist --project-name=site --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
