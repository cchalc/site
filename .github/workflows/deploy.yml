name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Only one deploy at a time; cancel superseded runs.
concurrency:
  group: deploy-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Use `npm install` rather than `npm ci`: the lockfile is generated on
      # macOS, and `npm ci` strict-mode intermittently hangs/crashes on the
      # Linux runner over platform-specific optional binaries
      # ("Exit handler never called!"). `npm install` re-resolves them cleanly.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Creates the Pages project named "site" on first run if it
          # doesn't already exist.
          command: pages deploy dist --project-name=site --branch=main
